name: CI

# On every push: build + test.
# On a `v*` tag push: additionally cross-compile the fixed four-platform
# release matrix and publish a GitHub release.
on:
  push:
    tags:
      - "v*"
    branches:
      - "**"

permissions:
  contents: read

# Cancel superseded runs on the same branch/tag so rapid pushes don't queue
# up redundant, uncancelled build+test jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # discovery/arp and the tcpsyn/udpscan enrichers cgo-bind to libpcap
      # (gopacket/pcap) even when just compiling for test purposes.
      - name: Install libpcap headers
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./...
        run: go test ./...

  # Builds the fixed four-target matrix from .goreleaser.yaml. One
  # matrix leg per platform, each on the runner OS that can natively
  # provide (or cross-provide) the C toolchain + libpcap/Npcap headers
  # gopacket/pcap's cgo bindings need — see .goreleaser.yaml's header
  # comment for why this can't be a single cross-compiling job.
  #
  # Each leg runs `goreleaser build --single-target`, not `goreleaser
  # release`: OSS GoReleaser has no way to merge binaries built on
  # different runners into one release (that "split/merge" workflow is a
  # GoReleaser Pro-only feature) — this project uses the free/OSS
  # distribution, so the `publish` job below does the archiving/checksum/
  # GitHub-release step itself once every leg's binary has been
  # downloaded, rather than through `goreleaser release`.
  build-release-binaries:
    name: Build (${{ matrix.id }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
          - id: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
          - id: linux-arm
            os: ubuntu-latest
            goos: linux
            goarch: arm
            goarm: "7"
          - id: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install libpcap (linux/amd64, native)
        if: matrix.id == 'linux-amd64'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # The runner's default apt sources point at amd64-only Ubuntu archive
      # mirrors. Adding a foreign architecture without first pinning those
      # sources to amd64 makes `apt-get update` also request the foreign
      # arch's indexes from them, 404, and exit 100 — so the `Architectures:`
      # line goes in before `dpkg --add-architecture`. ubuntu-24.04 keeps its
      # sources in deb822 format at sources.list.d/ubuntu.sources (only 22.04
      # still uses the one-line /etc/apt/sources.list).
      #
      # The ports list needs -updates/-security too, not just the release
      # pocket: libc6 is Multi-Arch: same, so every installed architecture of
      # it must be the *same version*. The image's libc6:amd64 comes from
      # -updates, so a ports list carrying only base `noble` offers no
      # matching libc6:arm64 and apt reports held broken packages.
      - name: Install cross toolchain + libpcap (linux/arm64)
        if: matrix.id == 'linux-arm64'
        run: |
          sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo dpkg --add-architecture arm64
          for pocket in "" -updates -security; do
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)${pocket} main universe"
          done | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libpcap-dev:arm64

      # Same amd64 pinning rationale as the linux/arm64 step above.
      - name: Install cross toolchain + libpcap (linux/arm)
        if: matrix.id == 'linux-arm'
        run: |
          sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo dpkg --add-architecture armhf
          for pocket in "" -updates -security; do
            echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)${pocket} main universe"
          done | sudo tee /etc/apt/sources.list.d/armhf.list
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libpcap-dev:armhf

      # No setup action: windows-latest (windows-2025) already ships
      # mingw-w64 gcc on PATH, which is all cgo needs here. This used to use
      # egor-tensin/setup-mingw@v2, which installs mingw fine and then fails
      # deleting a libpthread.dll.a that current mingw-builds no longer ship
      # (upstream issues #15/#17, closed unfixed) — so it breaks the leg on
      # whatever mingw version Chocolatey happens to serve. Kept as an
      # explicit check so a runner image that drops gcc fails here, loudly,
      # rather than inside goreleaser's cgo link step.
      - name: Verify MinGW-w64 (windows/amd64)
        if: matrix.id == 'windows-amd64'
        shell: bash
        run: gcc --version

      - name: Download Npcap SDK (windows/amd64)
        if: matrix.id == 'windows-amd64'
        shell: bash
        # --fail: a 404/error response must fail the step, not get silently
        # unzipped. The checksum is pinned trust-on-first-use against the
        # exact bytes served at this pinned URL/version — bump both together
        # if the SDK version above ever changes.
        #
        # Unpacked under RUNNER_TEMP, not the workspace: the SDK is a build
        # input, and leaving it in the checkout makes the tree dirty, which
        # goreleaser refuses to build from.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/npcap-sdk.zip" https://npcap.com/dist/npcap-sdk-1.13.zip
          echo "dad1f2bf1b02b787be08ca4862f99e39a876c1f274bac4ac0cedc9bbc58f94fd  $RUNNER_TEMP/npcap-sdk.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/npcap-sdk"
          unzip -q "$RUNNER_TEMP/npcap-sdk.zip" -d "$RUNNER_TEMP/npcap-sdk"

      # Installed as a native binary (not `go run ...@version` at build
      # time, below) precisely so the next step's GOOS/GOARCH env vars
      # target only the `nats` build goreleaser performs, not a
      # recompile of goreleaser itself — `go run` with cross GOOS/GOARCH
      # set would cross-compile the launcher too and then fail to exec it
      # on this host with "exec format error".
      #
      # Pinned (not @latest): the CLI's own build flags/dist layout are a
      # dependency of this pipeline (see the publish job's artifact
      # path/glob), so an upstream change should require a deliberate
      # version bump here, not silently apply on the next tag push.
      - name: Install goreleaser
        shell: bash
        env:
          # setup-go v6+ pins GOTOOLCHAIN=local, which is what we want for
          # building nats itself (it must compile under go.mod's Go version).
          # But goreleaser's own module requires a newer Go than go.mod
          # declares, and under GOTOOLCHAIN=local `go install` refuses to
          # fetch one and fails. Scoped to this step so only the tool build
          # may pull a newer toolchain.
          GOTOOLCHAIN: auto
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.17.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: goreleaser build --single-target --id ${{ matrix.id }}
        shell: bash
        env:
          # --single-target builds only for the *current* GOOS/GOARCH/GOARM
          # (regardless of what's declared in .goreleaser.yaml) unless these
          # are set explicitly — without them, every leg would silently
          # build for its runner's native arch instead of matrix.id's target
          # (e.g. linux-arm64/linux-arm on an amd64 ubuntu-latest host would
          # both just build linux/amd64).
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CC: ${{ matrix.id == 'linux-arm64' && 'aarch64-linux-gnu-gcc' || matrix.id == 'linux-arm' && 'arm-linux-gnueabihf-gcc' || '' }}
          CXX: ${{ matrix.id == 'linux-arm64' && 'aarch64-linux-gnu-g++' || matrix.id == 'linux-arm' && 'arm-linux-gnueabihf-g++' || '' }}
          CGO_CFLAGS: ${{ matrix.id == 'windows-amd64' && format('-I{0}/npcap-sdk/Include', runner.temp) || '' }}
          CGO_LDFLAGS: ${{ matrix.id == 'windows-amd64' && format('-L{0}/npcap-sdk/Lib/x64', runner.temp) || '' }}
        run: goreleaser build --single-target --clean --id ${{ matrix.id }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.id }}
          path: dist/${{ matrix.id }}_*/**
          if-no-files-found: error

  publish:
    name: Package archives & publish GitHub release
    needs: build-release-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist

      - name: Package one archive per platform + checksums.txt
        working-directory: dist
        run: |
          set -euo pipefail
          mkdir -p ../release
          for d in */; do
            id="$(basename "$d")"
            platform="${id#dist-}"
            bin_dir=$(find "$d" -mindepth 1 -maxdepth 1 -type d)
            if [[ -z "$bin_dir" || "$(wc -l <<<"$bin_dir")" -ne 1 ]]; then
              echo "expected exactly one artifact directory under $d, got: ${bin_dir:-<none>}" >&2
              exit 1
            fi
            name="nats_${platform//-/_}"
            # LICENSE is required, not optional: GPL-3.0 obliges us to
            # convey a copy of the license with every binary we distribute.
            # USAGE.md ships too — the README is only an overview, so
            # without it an archive documents nothing about how to run nats.
            cp ../README.md ../LICENSE "$bin_dir/"
            mkdir -p "$bin_dir/docs"
            cp ../docs/USAGE.md "$bin_dir/docs/"
            if [[ "$platform" == windows-* ]]; then
              (cd "$bin_dir" && zip -q -r "../../release/${name}.zip" .)
            else
              tar -czf "../release/${name}.tar.gz" -C "$bin_dir" .
            fi
          done
          cd ../release
          sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
